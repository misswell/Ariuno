<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CloudFloat · 跨域 iframe 测试</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #05070c; color: #eef2f8;
      font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; overflow: hidden; }
    iframe { border: 0; position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
    .badge {
      position: fixed; left: calc(env(safe-area-inset-left, 0px) + 12px);
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      max-width: min(360px, calc(100vw - 88px));
      padding: 9px 11px; border-radius: 12px;
      background: rgba(8, 12, 20, 0.78); border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px); pointer-events: none;
      font-size: 10px; line-height: 1.45; color: #aab5c8;
    }
    .badge strong { display: block; color: #ffb44d; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 3px; }
    code { font-family: "SF Mono", ui-monospace, Menlo, monospace; color: #dbe3f2; }
  </style>
</head>
<body>
<iframe id="frame" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
<div class="badge">
  <strong>Cross-origin iframe</strong>
  <span id="status">正在解析子 frame 地址…</span>
</div>
<script>
(() => {
  'use strict';
  const frame = document.getElementById('frame');
  const status = document.getElementById('status');
  const params = new URLSearchParams(location.search);
  const child = params.get('child') || 'native-video.html';
  let target;
  try {
    target = new URL(child, location.href);
  } catch (error) {
    target = new URL('native-video.html', location.href);
  }
  const sameOrigin = target.origin === location.origin;
  frame.src = target.href;
  status.innerHTML = [
    sameOrigin ? '同源子 frame（默认回退）' : '跨域子 frame（不同端口）',
    `父: <code>${location.origin}</code>`,
    `子: <code>${target.origin}</code>`,
    '父页面不能读取子页面 DOM；子 frame 内的探测脚本独立上报。',
    'iframe 已声明 allow="picture-in-picture"。'
  ].join('<br>');
})();
</script>
</body>
</html>
