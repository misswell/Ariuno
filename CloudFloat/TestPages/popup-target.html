<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CloudFloat · 模拟登录窗口</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0a0e16; color: #eef2f8;
      font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
    body { display: flex; align-items: center; justify-content: center; padding: 20px; }
    .panel { width: 100%; max-width: 380px; background: #121927; border: 1px solid rgba(255,255,255,.10);
      border-radius: 20px; padding: 20px; }
    .badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: #45d483; background: rgba(69,212,131,.12); padding: 4px 8px; border-radius: 999px; }
    h1 { font-size: 20px; margin: 12px 0 8px; }
    p { color: #9aa6b9; font-size: 12px; line-height: 1.6; margin: 0 0 14px; }
    button { width: 100%; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.08);
      color: #fff; border-radius: 11px; padding: 11px; font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
      line-height: 1; cursor: pointer; }
    .note { margin-top: 14px; font-size: 10px; color: #6c7a90; line-height: 1.5; }
  </style>
</head>
<body>
<main class="panel">
  <span class="badge">模拟成功</span>
  <h1>授权窗口已打开</h1>
  <p>这个页面仅用于验证 App 是否正确承载 <code>target=_blank</code> / <code>window.open</code> 弹窗。真实登录仍在官方网页完成。</p>
  <button id="close">关闭此窗口</button>
  <div class="note">没有提交任何表单，没有读取账号密码，也没有网络请求。</div>
</main>
<script>
(() => {
  'use strict';
  document.getElementById('close').addEventListener('click', () => {
    try { window.close(); } catch (error) {}
  });
})();
</script>
</body>
</html>
