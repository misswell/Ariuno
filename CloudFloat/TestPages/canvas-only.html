<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CloudFloat · Canvas / WebGL 测试</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #05070c; color: #eef2f8;
      font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .panel {
      position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      background: rgba(10, 15, 26, 0.78); border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 16px; padding: 14px; backdrop-filter: blur(14px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    .eyebrow { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #ffb44d; font-weight: 700; }
    h1 { font-size: 17px; margin: 4px 0 6px; }
    p { margin: 0; font-size: 12px; line-height: 1.5; color: #a8b3c6; }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button { appearance: none; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.08);
      color: #fff; border-radius: 10px; padding: 8px 12px; font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", -apple-system, sans-serif;
      font-size: 12px;
      font-weight: 600;
      line-height: 1; }
    .meta { margin-top: 8px; font-family: "SF Mono", ui-monospace, Menlo, "PingFang SC", monospace;
      font-size: 10px;
      line-height: 1.5; color: #6d7a8f; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="panel">
  <div class="eyebrow">CloudFloat · 反例页面</div>
  <h1>只有 Canvas / WebGL</h1>
  <p>
    画布由 requestAnimationFrame 实时绘制，但页面中没有 <code>&lt;video&gt;</code> 元素。
    屏幕上的画面无法交给系统 HTML5 画中画，因此 PiP 按钮应当被禁用并显示“没有可用视频”。
    这正是“画面可见 ≠ 可 PiP”必须区分的场景。
  </p>
  <div class="row">
    <button id="toggle">暂停绘制</button>
    <button id="reset">重置</button>
  </div>
  <div class="meta" id="meta">canvas: 1 · video: 0 · frame —</div>
</div>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const meta = document.getElementById('meta');
  let running = true;
  let frame = 0;
  let start = performance.now();
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  const blobs = Array.from({ length: 7 }, (_, index) => ({
    phase: index * 0.9,
    speed: 0.25 + index * 0.045,
    radius: 0.18 + (index % 3) * 0.06,
    hue: [222, 258, 190, 292, 210, 170, 240][index]
  }));

  function draw(now) {
    if (!running) return;
    frame += 1;
    const t = (now - start) / 1000;
    const w = canvas.width;
    const h = canvas.height;
    ctx.fillStyle = '#05070c';
    ctx.fillRect(0, 0, w, h);

    const gradient = ctx.createLinearGradient(0, 0, w, h);
    gradient.addColorStop(0, 'rgba(38, 77, 170, 0.20)');
    gradient.addColorStop(1, 'rgba(89, 35, 150, 0.18)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, w, h);

    blobs.forEach((blob) => {
      const x = w * (0.5 + 0.34 * Math.cos(t * blob.speed + blob.phase));
      const y = h * (0.5 + 0.30 * Math.sin(t * blob.speed * 1.2 + blob.phase * 1.3));
      const radius = Math.min(w, h) * blob.radius * (1 + 0.12 * Math.sin(t * 0.8 + blob.phase));
      const g = ctx.createRadialGradient(x, y, 0, x, y, radius);
      g.addColorStop(0, `hsla(${blob.hue}, 90%, 65%, 0.55)`);
      g.addColorStop(1, `hsla(${blob.hue}, 90%, 55%, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(t * 0.12);
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 2 * dpr;
    for (let i = 0; i < 9; i += 1) {
      ctx.beginPath();
      ctx.arc(0, 0, (40 + i * 34) * dpr, i * 0.5, i * 0.5 + Math.PI * 1.2);
      ctx.stroke();
    }
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.font = `600 ${Math.round(22 * dpr)}px -apple-system, "SF Pro Text", sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('Canvas only', w / 2, h / 2 - 10 * dpr);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = `500 ${Math.round(12 * dpr)}px "SF Mono", ui-monospace, Menlo, monospace`;
    ctx.fillText(`frame ${frame} · ${t.toFixed(1)}s`, w / 2, h / 2 + 20 * dpr);

    meta.textContent = `canvas: 1 · video: 0 · frame ${frame} · ${t.toFixed(1)}s`;
    requestAnimationFrame(draw);
  }

  document.getElementById('toggle').addEventListener('click', (event) => {
    running = !running;
    event.target.textContent = running ? '暂停绘制' : '继续绘制';
    if (running) requestAnimationFrame(draw);
  });

  document.getElementById('reset').addEventListener('click', () => {
    start = performance.now();
    frame = 0;
  });

  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
