<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desktop Mode Test</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 24px; }
    code { font-size: 14px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Desktop Mode Test</h1>
  <p>UA: <code id="ua"></code></p>
  <p>innerWidth: <code id="width"></code></p>
  <script>
    document.getElementById('ua').textContent = navigator.userAgent;
    document.getElementById('width').textContent = String(window.innerWidth);
  </script>
</body>
</html>
