<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CloudFloat · Cookie set probe</title>
</head>
<body style="background:#080b12;color:#eef2f8;font-family:-apple-system,sans-serif;padding:24px">
  <h1>Cookie set probe</h1>
  <p id="status">setting…</p>
  <script>
    (() => {
      'use strict';
      const value = new URLSearchParams(location.search).get('value') || 'test-value';
      document.cookie = 'cf_test_cookie=' + encodeURIComponent(value) + '; path=/; max-age=600; SameSite=Lax';
      document.getElementById('status').textContent = 'cookie set';
    })();
  </script>
</body>
</html>
