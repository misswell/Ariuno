name: Ariuno

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES

targets:
  Ariuno:
    type: application
    platform: iOS
    sources:
      - path: CloudFloat
        excludes:
          - "Tests/**"
          - "UITests/**"
          - "TestPages/**"
          - "Resources/Info.plist"
      - path: CloudFloat/TestPages
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misswell.Ariuno
        PRODUCT_NAME: Ariuno
        INFOPLIST_FILE: CloudFloat/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ALLOW_TARGET_PLATFORM_SPECIALIZATION: NO
        CODE_SIGN_ENTITLEMENTS: ""
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-Osize"
          SWIFT_COMPILATION_MODE: wholemodule
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          COPY_PHASE_STRIP: YES
          VALIDATE_PRODUCT: YES
          # QA-only offline pages (including a 2 MB sample video) are debug tooling and must
          # not ship in the release bundle.
          EXCLUDED_SOURCE_FILE_NAMES: "TestPages/* TestPages"
    dependencies: []
    preBuildScripts: []

  AriunoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CloudFloat/UITests
    dependencies:
      - target: Ariuno
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misswell.Ariuno.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Ariuno
        TARGETED_DEVICE_FAMILY: "1,2"

  AriunoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CloudFloat/Tests
    dependencies:
      - target: Ariuno
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misswell.Ariuno.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ariuno.app/Ariuno"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Ariuno:
    build:
      targets:
        Ariuno: all
        AriunoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AriunoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AriunoUITests:
    build:
      targets:
        Ariuno: all
        AriunoUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AriunoUITests
