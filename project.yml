name: CloudFloat

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES

targets:
  CloudFloat:
    type: application
    platform: iOS
    sources:
      - path: CloudFloat
        excludes:
          - "Tests/**"
          - "TestPages/**"
          - "Resources/Info.plist"
      - path: CloudFloat/TestPages
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudfloat.app
        PRODUCT_NAME: CloudFloat
        INFOPLIST_FILE: CloudFloat/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ALLOW_TARGET_PLATFORM_SPECIALIZATION: NO
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies: []
    preBuildScripts: []

  CloudFloatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CloudFloat/Tests
    dependencies:
      - target: CloudFloat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudfloat.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CloudFloat.app/CloudFloat"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  CloudFloat:
    build:
      targets:
        CloudFloat: all
        CloudFloatTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CloudFloatTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
