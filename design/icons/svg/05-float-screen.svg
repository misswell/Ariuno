<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5344FF"/>
      <stop offset="0.55" stop-color="#2E7BFF"/>
      <stop offset="1" stop-color="#0FA8E8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4F0FF"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5344FF"/>
      <stop offset="1" stop-color="#1583FF"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="softSmall" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g transform="rotate(-7 512 512)">
    <g filter="url(#soft)" opacity="0.38">
      <rect x="204" y="294" width="520" height="370" rx="84" fill="#0B2B6B"/>
    </g>
    <g filter="url(#softSmall)" opacity="0.38">
      <rect x="676" y="680" width="210" height="150" rx="44" fill="#0B2B6B"/>
    </g>

    <rect x="180" y="260" width="520" height="370" rx="84" fill="url(#screen)"/>
    <path d="M402 360 L402 530 L542 445 Z" fill="url(#play)" stroke="url(#play)" stroke-width="24" stroke-linejoin="round"/>

    <rect x="660" y="660" width="210" height="150" rx="44" fill="url(#screen)"/>
    <path d="M748 684 L748 746 L800 715 Z" fill="url(#play)" stroke="url(#play)" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
