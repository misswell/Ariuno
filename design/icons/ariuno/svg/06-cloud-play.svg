<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#061024"/>
      <stop offset="0.42" stop-color="#0B2A55"/>
      <stop offset="0.78" stop-color="#155A92"/>
      <stop offset="1" stop-color="#2A7FB8"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.24" cy="0.98" r="0.6">
      <stop offset="0" stop-color="#FFB36B" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFB36B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#020814" stop-opacity="0.58"/>
    </radialGradient>
    <linearGradient id="cloud" gradientUnits="userSpaceOnUse" x1="300" y1="320" x2="720" y2="790">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#F1F8FF"/>
      <stop offset="0.78" stop-color="#D8EAFF"/>
      <stop offset="1" stop-color="#B9D6FA"/>
    </linearGradient>
    <linearGradient id="playFill" gradientUnits="userSpaceOnUse" x1="420" y1="450" x2="620" y2="680">
      <stop offset="0" stop-color="#3557FF"/>
      <stop offset="0.5" stop-color="#2E9BFF"/>
      <stop offset="1" stop-color="#6BF0FF"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#DFFBFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#5BE6FF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1B7BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur16" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="blur26" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="blur40" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur60" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>

    <g id="cloudShape">
      <circle cx="340" cy="610" r="150"/>
      <circle cx="512" cy="550" r="210"/>
      <circle cx="684" cy="610" r="150"/>
      <rect x="300" y="660" width="424" height="100" rx="60"/>
    </g>
    <mask id="cloudMask"><use href="#cloudShape" fill="#FFFFFF"/></mask>
    <mask id="notHole">
      <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF"/>
      <path d="M450 470 L450 650 L640 560 Z" fill="#000000" stroke="#000000" stroke-width="20" stroke-linejoin="round"/>
    </mask>
    <mask id="cloudHoleMask">
      <use href="#cloudShape" fill="#FFFFFF"/>
      <path d="M450 470 L450 650 L640 560 Z" fill="#000000" stroke="#000000" stroke-width="20" stroke-linejoin="round"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#warm)"/>

  <g filter="url(#blur60)">
    <ellipse cx="180" cy="140" rx="430" ry="310" fill="#6B4BFF" opacity="0.38"/>
    <ellipse cx="850" cy="300" rx="360" ry="280" fill="#2FC8FF" opacity="0.26"/>
    <ellipse cx="760" cy="880" rx="420" ry="300" fill="#1B7BFF" opacity="0.35"/>
  </g>

  <g filter="url(#blur40)" opacity="0.4">
    <rect x="-220" y="250" width="1500" height="120" fill="#FFFFFF" opacity="0.14" transform="rotate(-20 512 512)"/>
  </g>

  <rect width="1024" height="1024" fill="url(#vig)"/>

  <ellipse cx="512" cy="802" rx="330" ry="42" fill="#031024" opacity="0.55" filter="url(#blur26)"/>

  <g mask="url(#notHole)">
    <g filter="url(#blur40)" opacity="0.4">
      <use href="#cloudShape" fill="#9FE6FF" transform="translate(18,24)"/>
    </g>
    <g filter="url(#blur40)" opacity="0.16">
      <use href="#cloudShape" fill="#FFFFFF" transform="translate(-16,-18)"/>
    </g>
  </g>

  <circle cx="545" cy="560" r="170" fill="url(#core)" opacity="0.16" filter="url(#blur40)"/>

  <g mask="url(#cloudMask)">
    <use href="#cloudShape" fill="url(#cloud)"/>
    <use href="#cloudShape" fill="#6F8FCF" opacity="0.38" transform="translate(0,34)" filter="url(#blur26)"/>
    <use href="#cloudShape" fill="#FFFFFF" opacity="0.6" transform="translate(-14,-26)" filter="url(#blur26)"/>
    <ellipse cx="400" cy="400" rx="230" ry="80" fill="#FFFFFF" opacity="0.6" transform="rotate(-24 400 400)" filter="url(#blur40)"/>
    <ellipse cx="640" cy="700" rx="240" ry="60" fill="#8FE8FF" opacity="0.2" transform="rotate(-8 640 700)" filter="url(#blur40)"/>
  </g>

  <g filter="url(#blur26)" opacity="0.4">
    <path d="M450 470 L450 650 L640 560 Z" fill="#06203F" transform="translate(0,20)"/>
  </g>
  <g filter="url(#blur16)" opacity="0.7">
    <path d="M450 470 L450 650 L640 560 Z" fill="url(#core)"/>
  </g>
  <path d="M450 470 L450 650 L640 560 Z" fill="url(#playFill)" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="5" stroke-linejoin="round"/>
  <path d="M450 470 L640 560 L450 650 Z" fill="none" stroke="#DFFBFF" stroke-opacity="0.3" stroke-width="2"/>

  <g opacity="0.8">
    <circle cx="238" cy="380" r="12" fill="#DFF6FF" opacity="0.55"/>
    <circle cx="238" cy="380" r="22" fill="#8FE8FF" opacity="0.15" filter="url(#blur16)"/>
    <circle cx="812" cy="470" r="8" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="812" cy="470" r="16" fill="#8FE8FF" opacity="0.15" filter="url(#blur8)"/>
    <circle cx="790" cy="250" r="5" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:overlay"/>
</svg>
