<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#070A20"/>
      <stop offset="0.5" stop-color="#0A1136"/>
      <stop offset="1" stop-color="#0B1A4A"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.46" r="0.74">
      <stop offset="0.52" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#02030C" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="aFill" gradientUnits="userSpaceOnUse" x1="260" y1="180" x2="780" y2="840">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.22" stop-color="#F0E7FF"/>
      <stop offset="0.48" stop-color="#C9D8FF"/>
      <stop offset="0.74" stop-color="#9FD0FF"/>
      <stop offset="1" stop-color="#74E4FF"/>
    </linearGradient>
    <linearGradient id="aRim" gradientUnits="userSpaceOnUse" x1="260" y1="170" x2="780" y2="850">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E6FAFF"/>
      <stop offset="1" stop-color="#A8F0FF"/>
    </linearGradient>
    <linearGradient id="aBloom" gradientUnits="userSpaceOnUse" x1="280" y1="220" x2="740" y2="840">
      <stop offset="0" stop-color="#B36BFF"/>
      <stop offset="0.5" stop-color="#5D7BFF"/>
      <stop offset="1" stop-color="#35D9FF"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="300" y1="220" x2="720" y2="850">
      <stop offset="0" stop-color="#6B5BFF"/>
      <stop offset="0.55" stop-color="#2B3FA8"/>
      <stop offset="1" stop-color="#0A1040"/>
    </linearGradient>
    <radialGradient id="holeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8FFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#5FE9FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1E7BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur18" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur28" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="blur44" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="44"/></filter>
    <filter id="blur90" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>

    <g id="aShape">
      <path d="M468 190 L556 190 L826 830 L664 830 L512 380 L360 830 L198 830 Z"/>
      <rect x="360" y="560" width="304" height="140"/>
    </g>
    <path id="playHole" d="M450 578 L450 682 L582 630 Z" stroke-linejoin="round"/>
    <mask id="aMask">
      <use href="#aShape" fill="#FFFFFF"/>
    </mask>
    <mask id="aHoleMask">
      <use href="#aShape" fill="#FFFFFF"/>
      <use href="#playHole" fill="#000000" stroke="#000000" stroke-width="18"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g filter="url(#blur90)">
    <ellipse cx="180" cy="120" rx="450" ry="310" fill="#7B4BFF" opacity="0.7" transform="rotate(-18 180 120)"/>
    <ellipse cx="870" cy="920" rx="450" ry="340" fill="#1FB8FF" opacity="0.45" transform="rotate(-14 870 920)"/>
    <ellipse cx="920" cy="110" rx="290" ry="230" fill="#FF5BD6" opacity="0.16"/>
  </g>

  <g filter="url(#blur44)" opacity="0.5">
    <rect x="-260" y="180" width="1540" height="150" fill="#FFFFFF" opacity="0.16" transform="rotate(-23 512 512)"/>
  </g>

  <rect width="1024" height="1024" fill="url(#vig)"/>

  <circle cx="512" cy="630" r="120" fill="url(#holeGlow)" filter="url(#blur28)"/>

  <g filter="url(#blur44)" opacity="0.58">
    <use href="#aShape" fill="url(#aBloom)"/>
  </g>
  <g filter="url(#blur28)" opacity="0.5">
    <use href="#aShape" fill="#02040F" transform="translate(0,34)"/>
  </g>

  <path d="M468 190 L556 190 L826 830 L664 830 L512 380 L360 830 L198 830 Z" fill="none" stroke="url(#aRim)" stroke-opacity="0.9" stroke-width="3" stroke-linejoin="round"/>

  <g mask="url(#aHoleMask)">
    <use href="#aShape" fill="url(#aFill)"/>
    <use href="#aShape" fill="#141A54" opacity="0.38" transform="translate(0,26)" filter="url(#blur18)"/>
    <use href="#aShape" fill="#FFFFFF" opacity="0.42" transform="translate(-12,-26)" filter="url(#blur10)"/>
    <ellipse cx="360" cy="280" rx="260" ry="90" fill="#FFFFFF" opacity="0.3" transform="rotate(-34 360 280)" filter="url(#blur28)"/>
    <path d="M468 190 L556 190 L640 470 L512 540 Z" fill="#FFFFFF" opacity="0.10" filter="url(#blur18)"/>
  </g>

  <g mask="url(#aMask)">
    <use href="#playHole" fill="none" stroke="#A9F6FF" stroke-opacity="0.8" stroke-width="12" filter="url(#blur6)"/>
  </g>

  <g opacity="0.55">
    <circle cx="132" cy="820" r="5" fill="#BFEFFF" filter="url(#blur6)"/>
    <circle cx="902" cy="300" r="8" fill="#D9C9FF" filter="url(#blur10)"/>
    <circle cx="846" cy="748" r="4" fill="#FFFFFF" filter="url(#blur6)"/>
    <circle cx="238" cy="292" r="3" fill="#FFFFFF" filter="url(#blur6)"/>
  </g>

  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:overlay"/>
</svg>
