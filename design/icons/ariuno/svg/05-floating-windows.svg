<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#06091C"/>
      <stop offset="0.5" stop-color="#0A1134"/>
      <stop offset="1" stop-color="#0D1D50"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.47" r="0.75">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#02030C" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="glassRim" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#CFE8FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8FE8FF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="pipFill" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#C9E2FF"/>
    </linearGradient>
    <linearGradient id="playFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D5BFF"/>
      <stop offset="0.55" stop-color="#2E9BFF"/>
      <stop offset="1" stop-color="#5BE8FF"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur14" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur26" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="blur40" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur80" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>
    <clipPath id="mainClip"><rect x="210" y="340" width="430" height="310" rx="46"/></clipPath>
    <clipPath id="pipClip"><rect x="660" y="648" width="200" height="150" rx="34"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g filter="url(#blur80)">
    <ellipse cx="210" cy="180" rx="460" ry="340" fill="#6B4BFF" opacity="0.55" transform="rotate(-18 210 180)"/>
    <ellipse cx="850" cy="860" rx="450" ry="330" fill="#17B8FF" opacity="0.42" transform="rotate(-14 850 860)"/>
    <ellipse cx="900" cy="160" rx="280" ry="230" fill="#FF5BD6" opacity="0.12"/>
  </g>

  <g filter="url(#blur40)" opacity="0.45">
    <rect x="-200" y="240" width="1500" height="180" fill="#FFFFFF" opacity="0.2" transform="rotate(-22 512 512)"/>
  </g>

  <rect width="1024" height="1024" fill="url(#vig)"/>

  <g transform="rotate(8 720 350)" opacity="0.85">
    <rect x="536" y="228" width="360" height="256" rx="40" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3" filter="url(#blur2)"/>
  </g>

  <g transform="rotate(-6 425 495)">
    <g filter="url(#blur26)" opacity="0.55">
      <rect x="210" y="352" width="430" height="310" rx="46" fill="#02040E"/>
    </g>
    <g filter="url(#blur40)" opacity="0.5">
      <rect x="210" y="340" width="430" height="310" rx="46" fill="#6B5BFF"/>
    </g>

    <rect x="210" y="340" width="430" height="310" rx="46" fill="url(#glass)" stroke="url(#glassRim)" stroke-width="4"/>

    <g clip-path="url(#mainClip)">
      <rect x="210" y="340" width="430" height="56" fill="#FFFFFF" fill-opacity="0.10"/>
      <path d="M210 396 L640 396" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
      <circle cx="252" cy="368" r="5" fill="#FFFFFF" fill-opacity="0.6"/>
      <circle cx="274" cy="368" r="5" fill="#FFFFFF" fill-opacity="0.4"/>
      <circle cx="296" cy="368" r="5" fill="#FFFFFF" fill-opacity="0.3"/>
      <rect x="250" y="432" width="190" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.16"/>
      <rect x="250" y="464" width="250" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.10"/>
      <rect x="250" y="488" width="170" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="250" y="530" width="210" height="82" rx="18" fill="#FFFFFF" fill-opacity="0.07"/>
      <rect x="486" y="530" width="118" height="82" rx="18" fill="#FFFFFF" fill-opacity="0.05"/>
      <rect x="330" y="470" width="380" height="150" fill="url(#sweep)" opacity="0.5" transform="rotate(-18 520 545)"/>
    </g>

    <path d="M210 386 Q210 340 256 340 L594 340 Q640 340 640 386" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
    <rect x="210" y="340" width="430" height="310" rx="46" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
  </g>

  <g transform="rotate(-3 760 723)">
    <g filter="url(#blur26)" opacity="0.65">
      <rect x="660" y="660" width="200" height="150" rx="34" fill="#02040E"/>
    </g>
    <g filter="url(#blur40)" opacity="0.6">
      <rect x="660" y="648" width="200" height="150" rx="34" fill="#2FC8FF"/>
    </g>

    <rect x="660" y="648" width="200" height="150" rx="34" fill="url(#pipFill)"/>
    <rect x="660" y="648" width="200" height="150" rx="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="3"/>

    <g clip-path="url(#pipClip)">
      <rect x="660" y="648" width="200" height="150" rx="34" fill="url(#sweep)" opacity="0.6" transform="rotate(-20 760 723)"/>
      <ellipse cx="740" cy="700" rx="90" ry="60" fill="#DFF8FF" opacity="0.5" filter="url(#blur26)"/>
    </g>

    <path d="M726 694 L726 752 L782 723 Z" fill="url(#playFill)" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g opacity="0.6">
    <circle cx="176" cy="298" r="4" fill="#FFFFFF" filter="url(#blur6)"/>
    <circle cx="870" cy="330" r="7" fill="#D9C9FF" filter="url(#blur14)"/>
    <circle cx="210" cy="836" r="4" fill="#8FF3FF" filter="url(#blur6)"/>
    <circle cx="890" cy="560" r="3" fill="#FFFFFF" filter="url(#blur6)"/>
  </g>

  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:overlay"/>
</svg>
