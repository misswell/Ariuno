<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#060A22"/>
      <stop offset="0.55" stop-color="#0A1136"/>
      <stop offset="1" stop-color="#101B4E"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.47" r="0.74">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#02030C" stop-opacity="0.72"/>
    </radialGradient>
    <radialGradient id="seal" cx="0.42" cy="0.36" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aFill" gradientUnits="userSpaceOnUse" x1="280" y1="280" x2="760" y2="760">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.3" stop-color="#F2F7FF"/>
      <stop offset="0.62" stop-color="#D3E3FF"/>
      <stop offset="1" stop-color="#9FBCE8"/>
    </linearGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="280" y1="280" x2="760" y2="760">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#DDF4FF"/>
      <stop offset="1" stop-color="#8FE8FF"/>
    </linearGradient>
    <linearGradient id="playFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#C9F8FF"/>
      <stop offset="1" stop-color="#4FE0FF"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D9FFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#4FE0FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#127BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur14" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur22" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blur34" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="blur60" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>

    <g id="aShape">
      <circle cx="470" cy="520" r="220"/>
      <rect x="600" y="300" width="170" height="440" rx="85"/>
    </g>
    <mask id="aMask"><use href="#aShape" fill="#FFFFFF"/></mask>
    <mask id="aHoleMask">
      <use href="#aShape" fill="#FFFFFF"/>
      <circle cx="470" cy="520" r="120" fill="#000000"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g filter="url(#blur60)">
    <ellipse cx="230" cy="180" rx="470" ry="350" fill="#6B4BFF" opacity="0.55"/>
    <ellipse cx="830" cy="900" rx="470" ry="340" fill="#17A8FF" opacity="0.32"/>
    <ellipse cx="880" cy="150" rx="260" ry="230" fill="#FF5BD6" opacity="0.1"/>
  </g>

  <circle cx="512" cy="512" r="408" fill="url(#seal)" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  <circle cx="512" cy="512" r="352" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
  <circle cx="512" cy="512" r="318" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5"/>
  <circle cx="512" cy="512" r="440" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="2 16" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="462" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  <circle cx="512" cy="512" r="462" fill="none" stroke="url(#rim)" stroke-opacity="0.35" stroke-width="5" stroke-dasharray="300 2600" transform="rotate(-50 512 512)" filter="url(#blur3)"/>
  <circle cx="512" cy="512" r="418" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="10" stroke-dasharray="2 26"/>

  <rect width="1024" height="1024" fill="url(#vig)"/>

  <circle cx="476" cy="520" r="190" fill="url(#core)" opacity="0.5" filter="url(#blur34)"/>

  <g filter="url(#blur34)" opacity="0.45">
    <use href="#aShape" fill="#02040F" transform="translate(0,38)"/>
  </g>

  <circle cx="470" cy="520" r="220" fill="none" stroke="url(#rim)" stroke-opacity="0.8" stroke-width="7"/>
  <rect x="600" y="300" width="170" height="440" rx="85" fill="none" stroke="url(#rim)" stroke-opacity="0.8" stroke-width="7"/>
  <circle cx="470" cy="520" r="120" fill="none" stroke="url(#rim)" stroke-opacity="0.55" stroke-width="7"/>

  <g mask="url(#aHoleMask)">
    <use href="#aShape" fill="url(#aFill)"/>
    <use href="#aShape" fill="#101A48" opacity="0.38" transform="translate(0,26)" filter="url(#blur22)"/>
    <use href="#aShape" fill="#FFFFFF" opacity="0.28" transform="translate(-10,-20)" filter="url(#blur14)"/>
    <ellipse cx="390" cy="330" rx="250" ry="80" fill="#FFFFFF" opacity="0.28" transform="rotate(-34 390 330)" filter="url(#blur34)"/>
  </g>

  <ellipse cx="476" cy="520" rx="150" ry="150" fill="url(#core)" opacity="0.55" filter="url(#blur34)"/>

  <path d="M415 460 L415 580 L533 520 Z" fill="url(#playFill)" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="7" stroke-linejoin="round"/>
  <path d="M415 460 L415 580 L533 520 Z" fill="none" stroke="#8FF3FF" stroke-opacity="0.5" stroke-width="16" stroke-linejoin="round" filter="url(#blur14)"/>

  <g opacity="0.55">
    <circle cx="170" cy="300" r="4" fill="#FFFFFF" filter="url(#blur8)"/>
    <circle cx="846" cy="330" r="6" fill="#D9C9FF" filter="url(#blur8)"/>
    <circle cx="820" cy="760" r="4" fill="#8FF3FF" filter="url(#blur8)"/>
  </g>

  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:overlay"/>
</svg>
