<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#04060F"/>
      <stop offset="0.5" stop-color="#070C24"/>
      <stop offset="1" stop-color="#0A1438"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.47" r="0.75">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#010208" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="orbGlass" cx="0.4" cy="0.34" r="0.68">
      <stop offset="0" stop-color="#0B1B4C" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#13245C" stop-opacity="0.5"/>
      <stop offset="0.86" stop-color="#2A4AA8" stop-opacity="0.82"/>
      <stop offset="0.97" stop-color="#5E93FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#B9E4FF" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="ringGrad" gradientUnits="userSpaceOnUse" x1="120" y1="380" x2="910" y2="640">
      <stop offset="0" stop-color="#8F6BFF"/>
      <stop offset="0.35" stop-color="#5B7BFF"/>
      <stop offset="0.7" stop-color="#3FC8FF"/>
      <stop offset="1" stop-color="#9FF6FF"/>
    </linearGradient>
    <linearGradient id="rimGrad" gradientUnits="userSpaceOnUse" x1="300" y1="270" x2="730" y2="740">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#CFE8FF"/>
      <stop offset="1" stop-color="#7FE8FF"/>
    </linearGradient>
    <linearGradient id="playFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#D6FBFF"/>
      <stop offset="1" stop-color="#55E0FF"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8FFFF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#5BE6FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1B7BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur16" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="blur26" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="blur40" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur70" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>
    <clipPath id="frontHalf"><rect x="-200" y="500" width="1424" height="600"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g filter="url(#blur70)">
    <ellipse cx="512" cy="470" rx="520" ry="420" fill="#2547B8" opacity="0.5"/>
    <ellipse cx="200" cy="160" rx="380" ry="300" fill="#7B4BFF" opacity="0.36"/>
    <ellipse cx="860" cy="880" rx="400" ry="320" fill="#12B8FF" opacity="0.3"/>
  </g>

  <g opacity="0.55">
    <circle cx="170" cy="240" r="2.5" fill="#FFFFFF"/>
    <circle cx="840" cy="200" r="3" fill="#CFE8FF"/>
    <circle cx="900" cy="640" r="2" fill="#FFFFFF"/>
    <circle cx="300" cy="860" r="2" fill="#9FE6FF"/>
    <circle cx="740" cy="840" r="2.5" fill="#FFFFFF"/>
  </g>

  <rect width="1024" height="1024" fill="url(#vig)"/>

  <ellipse cx="512" cy="804" rx="310" ry="42" fill="#02040E" opacity="0.7" filter="url(#blur26)"/>
  <ellipse cx="512" cy="792" rx="200" ry="26" fill="#2FC8FF" opacity="0.25" filter="url(#blur26)"/>

  <g transform="rotate(-18 512 500)">
    <ellipse cx="512" cy="500" rx="420" ry="120" fill="none" stroke="url(#ringGrad)" stroke-width="24"/>
    <ellipse cx="512" cy="500" rx="420" ry="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"/>
  </g>

  <g filter="url(#blur40)" opacity="0.75">
    <circle cx="512" cy="500" r="250" fill="#2B5BFF"/>
  </g>

  <circle cx="512" cy="500" r="250" fill="url(#orbGlass)"/>
  <circle cx="512" cy="500" r="250" fill="none" stroke="url(#rimGrad)" stroke-opacity="0.85" stroke-width="5"/>

  <g clip-path="url(#frontHalf)">
    <ellipse cx="512" cy="500" rx="250" ry="250" fill="none" stroke="#0A1230" stroke-opacity="0.35" stroke-width="40" filter="url(#blur26)"/>
  </g>

  <circle cx="512" cy="500" r="150" fill="url(#core)" opacity="0.55" filter="url(#blur26)"/>
  <path d="M430 390 L430 610 L650 500 Z" fill="#8FF3FF" opacity="0.4" filter="url(#blur26)"/>
  <path d="M430 390 L430 610 L650 500 Z" fill="url(#playFill)" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="6" stroke-linejoin="round"/>

  <ellipse cx="420" cy="350" rx="110" ry="62" fill="#FFFFFF" opacity="0.4" transform="rotate(-32 420 350)" filter="url(#blur26)"/>
  <path d="M290 640 A 250 250 0 0 0 720 640" fill="none" stroke="#9FF6FF" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" filter="url(#blur8)"/>
  <path d="M300 620 A 250 250 0 0 0 690 660" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>

  <g transform="rotate(-18 512 500)">
    <g clip-path="url(#frontHalf)">
      <ellipse cx="512" cy="500" rx="420" ry="120" fill="none" stroke="url(#ringGrad)" stroke-width="24"/>
      <ellipse cx="512" cy="500" rx="420" ry="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"/>
    </g>
  </g>

  <g transform="rotate(-18 512 500)">
    <circle cx="188" cy="500" r="20" fill="#D9FBFF"/>
    <circle cx="188" cy="500" r="34" fill="#7FE8FF" opacity="0.35" filter="url(#blur16)"/>
  </g>

  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:overlay"/>
</svg>
