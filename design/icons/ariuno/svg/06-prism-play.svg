<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#04050D"/>
      <stop offset="0.5" stop-color="#070B1E"/>
      <stop offset="1" stop-color="#0A1436"/>
    </linearGradient>
    <radialGradient id="stage" cx="0.5" cy="0.54" r="0.55">
      <stop offset="0" stop-color="#2B4BC8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2B4BC8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.47" r="0.75">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#010207" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#CFE8FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7FD9FF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="340" y1="330" x2="740" y2="710">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#D9F2FF"/>
      <stop offset="1" stop-color="#8FE8FF"/>
    </linearGradient>
    <linearGradient id="beamWarm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB36B" stop-opacity="0.65"/>
      <stop offset="0.6" stop-color="#FF6BD6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FF6BD6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B06BFF" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#7B6BFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7B6BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8BFF" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#2F7BFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2F7BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FF4FF" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#2FE8FF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2FE8FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamWhite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#DFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#DFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur14" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur24" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur40" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur70" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>
    <clipPath id="prismClip"><path d="M340 330 L340 710 L740 520 Z"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#stage)"/>

  <g filter="url(#blur70)">
    <ellipse cx="180" cy="760" rx="420" ry="260" fill="#6B4BFF" opacity="0.22"/>
    <ellipse cx="850" cy="260" rx="420" ry="300" fill="#17B8FF" opacity="0.22"/>
  </g>

  <rect width="1024" height="1024" fill="url(#vig)"/>

  <g opacity="0.9">
    <path d="M540 420 L1024 250 L1024 330 L540 470 Z" fill="url(#beamViolet)" filter="url(#blur24)"/>
    <path d="M560 450 L1024 400 L1024 470 L560 500 Z" fill="url(#beamBlue)" filter="url(#blur24)"/>
    <path d="M680 505 L1024 500 L1024 560 L660 550 Z" fill="url(#beamCyan)" filter="url(#blur24)"/>
    <path d="M570 590 L1024 700 L1024 780 L560 640 Z" fill="url(#beamWarm)" filter="url(#blur24)"/>
    <path d="M560 460 L1024 450 L1024 520 L560 510 Z" fill="url(#beamWhite)" opacity="0.35" filter="url(#blur14)"/>
  </g>

  <ellipse cx="540" cy="800" rx="300" ry="46" fill="#01040C" opacity="0.75" filter="url(#blur24)"/>
  <ellipse cx="560" cy="792" rx="200" ry="26" fill="#2FC8FF" opacity="0.18" filter="url(#blur24)"/>

  <g transform="translate(16,20)">
    <path d="M340 330 L340 710 L740 520 Z" fill="#0A1230" opacity="0.85"/>
  </g>

  <g>
    <path d="M340 330 L340 710 L740 520 Z" fill="url(#glass)" stroke="url(#rim)" stroke-opacity="0.8" stroke-width="4" stroke-linejoin="round"/>
    <g clip-path="url(#prismClip)">
      <path d="M340 330 L740 520 L340 710 Z" fill="url(#beamCyan)" opacity="0.10"/>
      <path d="M340 330 L340 710 L520 520 Z" fill="#FFFFFF" opacity="0.08"/>
      <path d="M460 330 L740 520 L460 710 Z" fill="#8FE8FF" opacity="0.06"/>
      <ellipse cx="420" cy="400" rx="180" ry="60" fill="#FFFFFF" opacity="0.35" transform="rotate(-28 420 400)" filter="url(#blur40)"/>
      <rect x="300" y="300" width="160" height="500" fill="#FFFFFF" opacity="0.06" transform="rotate(-18 380 550)"/>
    </g>
    <path d="M340 330 L340 710" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
    <path d="M340 710 L740 520" stroke="#8FE8FF" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
    <path d="M340 330 L740 520" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g filter="url(#blur14)" opacity="0.8">
    <path d="M40 300 L340 400 L340 470 L40 380 Z" fill="url(#beamWhite)"/>
  </g>
  <path d="M40 340 L340 435" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="4" stroke-linecap="round" filter="url(#blur2)"/>

  <g filter="url(#blur24)" opacity="0.4">
    <path d="M340 740 L740 540 L760 600 L360 800 Z" fill="#7FF4FF" transform="scale(1,-0.5) translate(0,2400)" opacity="0.35"/>
  </g>

  <g opacity="0.6">
    <circle cx="240" cy="220" r="3" fill="#FFFFFF" filter="url(#blur3)"/>
    <circle cx="850" cy="180" r="5" fill="#CFE8FF" filter="url(#blur8)"/>
    <circle cx="900" cy="820" r="3" fill="#FFB36B" filter="url(#blur8)"/>
  </g>

  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:overlay"/>
</svg>
